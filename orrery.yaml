# What this repository builds: its service, the APIs it provides, and the
# APIs it calls. redgreen, the forge reader, reads this file for every estate
# that reads this repository and writes the service and its APIs into that
# estate's Orrery. `fields` and `relations` place it in an estate's platform
# pillars (plat_pillar); an API key is the providing service's key and its id.
service: github/orchard-suite/tally/cmd/tally
icon:
  name: tally
  file: logo.svg
fields:
  category: Cost
relations:
  pillars:
  - platform/cost
  - platform/agents
  - platform/catalog
provides:
- id: costs
  title: Tally costs API
  kind: rest
  description: What the estate, each host, each namespace, each subscription, and each agent conversation costs.
  spec: openapi.yaml
- id: usage
  title: Tally usage intake
  kind: rest
  description: Where each machine's shipper posts its agents' token use by model and minute.
  spec: openapi.yaml
consumes:
- github/orchard-suite/orrery/catalog
- github/prometheus/prometheus/query
